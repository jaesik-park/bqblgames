name: iOS build check

# Manual only: macOS runners cost more minutes. This compiles the app for the
# simulator without signing; App Store builds are archived from Xcode.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: zombie-squad
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: zombie-squad/package-lock.json

      - name: Build web app
        run: |
          npm ci
          npm run build
          npx cap sync ios

      - name: Build for simulator
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -sdk iphonesimulator -configuration Debug \
            -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO build
